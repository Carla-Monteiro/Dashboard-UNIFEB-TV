<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Chamados - UNIFEB</title>
    <style>
        :root {
            --bg-dark: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #242d3d;
            --border-gold: #d4a574;
            --gold: #ffa500;
            --orange: #ff9800;
            --green: #10b981;
            --red: #ef5350;
            --blue: #60a5fa;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* TELA DE LOGIN */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-container {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            border: 2px solid var(--border-gold);
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(255, 165, 0, 0.2);
            text-align: center;
        }

        .login-logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin: 0 auto 40px;
            display: block;
            filter: brightness(1.1);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-input {
            width: 100%;
            padding: 14px 15px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.3);
        }

        .login-button {
            padding: 14px 20px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-button:hover {
            background: var(--orange);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-error {
            color: var(--red);
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        /* DASHBOARD */
        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            gap: 0;
        }

        .dashboard-container.hidden {
            display: none;
        }

        .header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            border-bottom: 1px solid var(--border-gold);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            width: 80px;
            height: auto;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-secondary);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-gold);
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .logout-btn {
            padding: 6px 12px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-container">
            <img src="logo-UNIFEB.png" alt="UNIFEB" class="login-logo">
            <h2 class="login-title">Controle de Chamados</h2>
            <p class="login-subtitle">Sistema de Gerenciamento SharePoint</p>
            
            <form class="login-form" id="loginForm">
                <input type="password" class="login-input" id="senhaInput" placeholder="Digite sua senha" required autofocus>
                <button type="submit" class="login-button">Entrar</button>
                <div class="login-error" id="loginError">❌ Senha incorreta!</div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard-container hidden" id="dashboard">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img src="logo-UNIFEB.png" alt="UNIFEB" class="header-logo">
                <div class="header-title">
                    <h1>Controle de Chamados</h1>
                    <p>Gerenciamento em Tempo Real - SharePoint</p>
                </div>
            </div>
            
            <div class="user-info">
                <div>
                    <div class="user-role">Usuário: <span id="userNameDisplay">Admin</span></div>
                </div>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </div>

        <!-- Dashboard content will be loaded from config.js and dashboard.js -->
        <div id="sidebar" class="sidebar"></div>
        <div id="mainContent" class="main-content"></div>
    </div>

    <script>
        // DADOS DE SENHAS
        const senhas = {
            'Daniel2304@': { nome: 'Carla (Admin)', role: 'admin' },
            'Unifeb@62': { nome: 'Estagiário', role: 'estagiario' }
        };

        let usuarioLogado = null;

        // EVENTOS DE LOGIN
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const senha = document.getElementById('senhaInput').value;
            
            if (senhas[senha]) {
                usuarioLogado = senhas[senha];
                document.getElementById('userNameDisplay').textContent = usuarioLogado.nome;
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                // Aqui será carregado o dashboard completo via config.js e dashboard.js
                console.log('✅ Login bem-sucedido como:', usuarioLogado.nome);
            } else {
                document.getElementById('loginError').classList.add('show');
                document.getElementById('senhaInput').value = '';
                setTimeout(() => {
                    document.getElementById('loginError').classList.remove('show');
                }, 3000);
            }
        });

        function logout() {
            usuarioLogado = null;
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('senhaInput').value = '';
            document.getElementById('senhaInput').focus();
        }
    </script>
</body>
</html>
