name: 🔄 Sync SharePoint Data (Otimizado)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: pip install requests
      
      - name: 🔄 Sync SharePoint (OTIMIZADO)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
        run: python sync_github.py
      
      - name: 📝 Commit and push
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add chamados_sync.json
          git commit -m "🔄 Auto-sync: Updated SharePoint data" || echo "No changes"
          git push
      
      - name: ✅ Verificar sucesso
        run: |
          if [ -f "chamados_sync.json" ]; then
            echo "✅ JSON atualizado com sucesso!"
          else
            echo "❌ Erro: JSON não foi criado!"
            exit 1
          fi
