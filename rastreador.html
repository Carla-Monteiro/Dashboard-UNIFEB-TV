<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Chamado - UNIFEB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1F4788 0%, #FF9500 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1F4788 0%, #FF9500 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header img {
            height: 50px;
            margin-bottom: 15px;
            filter: brightness(0) invert(1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .content {
            padding: 30px 20px;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .card-chamado {
            background: #f9f9f9;
            border: 2px solid #1F4788;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-chamado h2 {
            color: #1F4788;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .campo {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .campo:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .campo-label {
            font-weight: 600;
            color: #1F4788;
            min-width: 150px;
        }

        .campo-valor {
            color: #333;
            text-align: right;
            flex: 1;
            padding-left: 15px;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-aberto {
            background: rgba(31, 71, 136, 0.2);
            color: #1F4788;
        }

        .status-andamento {
            background: rgba(255, 149, 0, 0.2);
            color: #FF9500;
        }

        .status-concluido {
            background: rgba(76, 175, 80, 0.2);
            color: #388e3c;
        }

        .status-fechado {
            background: rgba(158, 158, 158, 0.2);
            color: #616161;
        }

        .info-box {
            background: linear-gradient(135deg, rgba(31, 71, 136, 0.1) 0%, rgba(255, 149, 0, 0.1) 100%);
            border-left: 4px solid #1F4788;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1F4788;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-voltar {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #1F4788;
        }

        .btn-voltar:hover {
            background: #1F4788;
            color: white;
        }

        .btn-atualizar {
            background: linear-gradient(135deg, #1F4788 0%, #FF9500 100%);
            color: white;
        }

        .btn-atualizar:hover {
            box-shadow: 0 4px 15px rgba(31, 71, 136, 0.3);
            transform: translateY(-2px);
        }

        .descricao-completa {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #FF9500;
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #555;
            max-height: 300px;
            overflow-y: auto;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 20px 15px;
            }

            .campo {
                flex-direction: column;
                align-items: flex-start;
            }

            .campo-valor {
                text-align: left;
                padding-left: 0;
                margin-top: 5px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

            <h1>Acompanhamento de Chamado</h1>
            <p>Controle de Chamados - UNIFEB</p>
        </div>

        <div class="content" id="conteudo">
            <!-- Conteúdo será inserido aqui -->
        </div>
    </div>

    <script>
        function carregarChamado() {
            const urlParams = new URLSearchParams(window.location.search);

            const numero = urlParams.get('numero');
            const titulo = urlParams.get('titulo');
            const status = urlParams.get('status') || 'Aberto';
            const setor = urlParams.get('setor') || 'Não especificado';
            const prioridade = urlParams.get('prioridade') || 'Normal';
            const descricao = urlParams.get('descricao') || '';
            const dataAbertura = urlParams.get('dataAbertura') || new Date().toLocaleDateString('pt-BR');

            if (!numero) {
                document.getElementById('conteudo').innerHTML = `
                    <div class="error">
                        ❌ Erro: Número do chamado não encontrado na URL.
                    </div>
                `;
                return;
            }

            const statusMap = {
                'Aberto': 'aberto',
                'Em Andamento': 'andamento',
                'Em andamento': 'andamento',
                'Concluído': 'concluido',
                'Fechado': 'fechado'
            };

            const statusClass = `status-${statusMap[status] || 'aberto'}`;

            const html = `
                <div class="info-box">
                    <strong>ℹ️ Informações de Rastreamento</strong>
                    Acompanhe o status do seu chamado aqui. Nosso time de suporte está trabalhando para resolver sua solicitação.
                </div>

                <div class="card-chamado">
                    <h2>
                        <span>#${numero}</span>
                        <span class="status-badge ${statusClass}">${status}</span>
                    </h2>

                    <div class="campo">
                        <span class="campo-label">Título:</span>
                        <span class="campo-valor">${decodeURIComponent(titulo || 'Sem título')}</span>
                    </div>

                    <div class="campo">
                        <span class="campo-label">Número:</span>
                        <span class="campo-valor"><strong>${numero}</strong></span>
                    </div>

                    <div class="campo">
                        <span class="campo-label">Status:</span>
                        <span class="campo-valor">
                            <span class="status-badge ${statusClass}">${status}</span>
                        </span>
                    </div>

                    <div class="campo">
                        <span class="campo-label">Setor:</span>
                        <span class="campo-valor">${decodeURIComponent(setor || 'Não especificado')}</span>
                    </div>

                    <div class="campo">
                        <span class="campo-label">Prioridade:</span>
                        <span class="campo-valor">${decodeURIComponent(prioridade || 'Normal')}</span>
                    </div>

                    <div class="campo">
                        <span class="campo-label">Data de Abertura:</span>
                        <span class="campo-valor">${dataAbertura}</span>
                    </div>

                    ${descricao ? `
                    <div>
                        <div class="campo-label" style="border: none; padding-bottom: 10px;">Descrição:</div>
                        <div class="descricao-completa">${decodeURIComponent(descricao)}</div>
                    </div>
                    ` : ''}
                </div>

                <div class="botoes">
                    <button class="btn btn-atualizar" onclick="location.reload()">🔄 Atualizar</button>
                    <button class="btn btn-voltar" onclick="window.close(); if(!window.closed) window.history.back();">← Voltar</button>
                </div>

                <div class="timestamp">
                    Página atualizada em: <strong>${new Date().toLocaleString('pt-BR')}</strong>
                </div>
            `;

            document.getElementById('conteudo').innerHTML = html;
        }

        // Carregar ao abrir a página
        window.addEventListener('load', carregarChamado);
    </script>
</body>
</html>
